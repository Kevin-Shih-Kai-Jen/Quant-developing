<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Quant OS — 量化交易系統終端介面，提供即時資產監控、AI 投資顧問與系統健康檢查。">
    <title>Nexus Quant OS — 量化交易系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: rgba(255,255,255,0.03);
            --border-card: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --text-primary: #f0f4f8;
            --text-secondary: #8892a4;
            --text-muted: #4a5568;
            --cyan: #00f0ff;
            --cyan-dim: rgba(0,240,255,0.15);
            --cyan-glow: rgba(0,240,255,0.3);
            --green: #00e676;
            --green-dim: rgba(0,230,118,0.15);
            --red: #ff3366;
            --red-dim: rgba(255,51,102,0.15);
            --yellow: #ffb800;
            --yellow-dim: rgba(255,184,0,0.15);
            --blue-bubble: rgba(0,100,255,0.2);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-pill: 999px;
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-glow: 0 0 20px rgba(0,240,255,0.08);
            --transition-fast: 0.2s cubic-bezier(0.4,0,0.2,1);
            --transition-smooth: 0.35s cubic-bezier(0.4,0,0.2,1);
            --nav-height: 64px;
        }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 8px rgba(0,240,255,0.2); }
            50% { box-shadow: 0 0 20px rgba(0,240,255,0.4); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-in {
            animation: fadeIn 0.5s var(--transition-smooth) both;
        }
        .animate-in-delay-1 { animation-delay: 0.08s; }
        .animate-in-delay-2 { animation-delay: 0.16s; }
        .animate-in-delay-3 { animation-delay: 0.24s; }
        .animate-in-delay-4 { animation-delay: 0.32s; }
        .animate-in-delay-5 { animation-delay: 0.40s; }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(11,15,25,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-card);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .nav-logo .logo-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px rgba(0,240,255,0.4));
        }
        .nav-logo .logo-text {
            background: linear-gradient(135deg, var(--cyan), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }
        .nav-tab {
            position: relative;
            padding: 8px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.04);
        }
        .nav-tab.active {
            color: var(--cyan);
        }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: var(--cyan);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(0,230,118,0.5);
            animation: glow 2s ease-in-out infinite;
        }
        .status-dot.disconnected {
            background: var(--red);
            box-shadow: 0 0 8px rgba(255,51,102,0.5);
        }

        /* ===== Main Content ===== */
        .main-content {
            padding-top: calc(var(--nav-height) + 24px);
            padding-bottom: 32px;
            min-height: 100vh;
        }

        .page {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .page.active {
            display: block;
        }

        /* ===== Glass Card ===== */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 24px;
            transition: all var(--transition-smooth);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-card), var(--shadow-glow);
        }
        .glass-card.no-hover:hover {
            transform: none;
        }

        /* ===== Dashboard Page ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .stat-label .stat-emoji {
            font-size: 1.1rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .stat-value.cyan { color: var(--cyan); }
        .stat-value.green { color: var(--green); }

        .stat-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .risk-badge.normal { background: var(--green-dim); color: var(--green); }
        .risk-badge.caution { background: var(--yellow-dim); color: var(--yellow); }
        .risk-badge.warning { background: rgba(255,140,0,0.15); color: #ff8c00; }
        .risk-badge.emergency { background: var(--red-dim); color: var(--red); }

        .panels-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .title-icon {
            font-size: 1.1rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        /* ===== Table ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table thead th {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-card);
        }
        .data-table tbody tr {
            transition: background var(--transition-fast);
        }
        .data-table tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .data-table tbody td {
            padding: 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-variant-numeric: tabular-nums;
        }
        .data-table .symbol-cell {
            font-weight: 700;
            color: var(--cyan);
            font-size: 0.9rem;
        }
        .data-table .positive { color: var(--green); }
        .data-table .negative { color: var(--red); }

        .model-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .model-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .model-info-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }
        .model-info-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-all;
        }

        .asset-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .asset-badge {
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--cyan-dim);
            color: var(--cyan);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .env-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            font-weight: 700;
            background: var(--yellow-dim);
            color: var(--yellow);
            letter-spacing: 0.06em;
        }

        /* ===== Chat Page ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--nav-height) - 48px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            line-height: 1.65;
            animation: fadeInScale 0.3s ease both;
            word-wrap: break-word;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: var(--blue-bubble);
            border: 1px solid rgba(0,100,255,0.15);
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.ai {
            align-self: flex-start;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-bottom-left-radius: 4px;
        }

        .chat-bubble-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .chat-bubble-wrapper.user-wrapper {
            justify-content: flex-end;
        }

        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--cyan-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            border: 1px solid rgba(0,240,255,0.2);
        }

        .chat-bubble strong, .chat-bubble b { color: var(--cyan); font-weight: 600; }
        .chat-bubble ul, .chat-bubble ol { padding-left: 20px; margin: 8px 0; }
        .chat-bubble li { margin-bottom: 4px; }
        .chat-bubble p { margin-bottom: 8px; }
        .chat-bubble p:last-child { margin-bottom: 0; }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            align-items: center;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0;
        }
        .quick-btn {
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            white-space: nowrap;
        }
        .quick-btn:hover {
            background: var(--cyan-dim);
            border-color: rgba(0,240,255,0.3);
            color: var(--cyan);
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 16px 0 8px;
            align-items: flex-end;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }
        .chat-input {
            width: 100%;
            padding: 14px 18px;
            padding-right: 50px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color var(--transition-fast);
            resize: none;
        }
        .chat-input:focus {
            border-color: rgba(0,240,255,0.3);
            box-shadow: 0 0 0 3px rgba(0,240,255,0.06);
        }
        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .file-preview {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .file-preview.visible { display: inline-flex; }
        .file-preview .remove-file {
            cursor: pointer;
            color: var(--red);
            font-weight: 700;
            margin-left: 4px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--cyan-dim);
            border-color: rgba(0,240,255,0.3);
            color: var(--cyan);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--cyan), #0080ff);
            border-color: transparent;
            color: var(--bg-primary);
            font-weight: 700;
        }
        .send-btn:hover {
            filter: brightness(1.15);
            transform: scale(1.04);
        }

        /* ===== Monitor Page ===== */
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .monitor-grid .full-width {
            grid-column: 1 / -1;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: var(--radius-pill);
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-fast);
        }
        .action-btn:hover {
            background: var(--cyan);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .action-btn:disabled:hover {
            background: transparent;
            color: var(--cyan);
            box-shadow: none;
        }

        .health-results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .health-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.04);
            transition: background var(--transition-fast);
        }
        .health-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .health-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .health-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 140px;
        }
        .health-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex: 1;
        }

        .summary-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .summary-badge.healthy { background: var(--green-dim); color: var(--green); }
        .summary-badge.unhealthy { background: var(--red-dim); color: var(--red); }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,240,255,0.2);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .pipeline-results {
            margin-top: 20px;
        }
        .pipeline-results .reasoning-panel {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--cyan);
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* ===== Error / Empty States ===== */
        .error-banner {
            padding: 16px 20px;
            background: var(--red-dim);
            border: 1px solid rgba(255,51,102,0.2);
            border-radius: var(--radius-md);
            color: var(--red);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            filter: grayscale(0.5);
        }
        .empty-state p {
            font-size: 0.9rem;
            max-width: 360px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== Welcome Screen ===== */
        .welcome-hero {
            text-align: center;
            padding: 64px 24px 40px;
        }
        .welcome-hero .hero-logo {
            font-size: 4rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 24px rgba(0,240,255,0.3));
        }
        .welcome-hero h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--cyan), #a78bfa, var(--cyan));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
        }
        .welcome-hero p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        /* ===== Allocation Table ===== */
        .alloc-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

    </style>
</head>
<body>

    <!-- ===== Main Content ===== -->

                            <canvas id="allocationChart"></canvas>

                    </div>
                    <div class="glass-card animate-in animate-in-delay-4 no-hover">
                        <div class="card-title"><span class="title-icon">📋</span> 持倉明細</div>
                        <div style="overflow-x:auto;">
                            <table class="data-table" id="positionsTable">
                                <thead>

        <!-- ===== Advisor Page ===== -->
        <section class="page" id="page-advisor">

                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendQuickAction('請推薦目前最佳的資產配置方案')">📊 推薦配置</button>

                    <button class="quick-btn" onclick="sendQuickAction('請對我的投資組合進行風險分析')">📈 風險分析</button>
                    <button class="quick-btn" onclick="sendQuickAction('請顯示我的個人資料與設定')">👤 我的資料</button>

                <div class="chat-input-area">

                    <input type="file" id="imageUpload" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

                        <input type="text" class="chat-input" id="chatInput" placeholder="輸入訊息..." onkeydown="handleChatKeydown(event)">

    <script>
    /* =========================================================
       Nexus Quant OS — Single Page Application Controller
       ========================================================= */

    // ===== State =====
    let currentPage = 'dashboard';
    let dashboardInterval = null;
    let allocationChart = null;
    let chatHistory = [];
    let selectedFile = null;
    let isConnected = true;

    // ===== Utilities =====
    function formatCurrency(val) {
        if (val == null || isNaN(val)) return '—';
        return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function animateValue(el, start, end, duration, formatter) {
        if (start === end) { el.textContent = formatter ? formatter(end) : end; return; }
        const startTime = performance.now();
        function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = start + (end - start) * eased;
            el.textContent = formatter ? formatter(current) : Math.round(current);
            if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    function renderMarkdown(text) {
        if (!text) return '';
        let html = text;
        // Escape HTML
        html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        // Bold
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // Italic
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        // Inline code
        html = html.replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;font-size:0.82em;">$1</code>');
        // Unordered list
        html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
        // Numbered list
        html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
        // Line breaks
        html = html.replace(/\n/g, '<br>');
        // Clean up double <br> in lists
        html = html.replace(/<br><li>/g, '<li>');
        html = html.replace(/<\/li><br>/g, '</li>');
        html = html.replace(/<br><ul>/g, '<ul>');
        html = html.replace(/<\/ul><br>/g, '</ul>');
        // Wrap paragraphs
        return html;
    }

    // ===== SPA Routing =====
    function showPage(page) {
        currentPage = page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

        const target = document.getElementById('page-' + page);
        if (target) target.classList.add('active');

        const tab = document.querySelector(`.nav-tab[data-page="${page}"]`);
        if (tab) tab.classList.add('active');

        // Page-specific logic
        if (page === 'dashboard') {
            loadDashboard();
            startDashboardRefresh();
        } else {
            stopDashboardRefresh();
        }

        if (page === 'monitor') {
            loadMonitorModelInfo();
        }

        if (page === 'advisor') {
            setTimeout(() => {
                const input = document.getElementById('chatInput');
                if (input) input.focus();
            }, 100);
        }
    }

    // ===== Dashboard =====
    async function loadDashboard() {
        try {
            const resp = await fetch('/api/dashboard');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            if (data.error || (data.account && data.account.error)) {
                showDashboardError(data.error || data.account.error);
                return;
            }

            updateConnectionStatus(true);
            renderDashboard(data);
        } catch (err) {
            console.error('Dashboard load error:', err);
            showDashboardError('無法載入儀表板資料。請確認 API 伺服器是否正在運行。');
            updateConnectionStatus(false);
        }
    }

    function showDashboardError(msg) {
        document.getElementById('welcomeHero').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'none';
        const errDiv = document.getElementById('dashboardError');
        errDiv.style.display = 'block';
        errDiv.innerHTML = `<div class="error-banner animate-in">🚨 ${msg}</div>`;
    }

    function renderDashboard(data) {
        document.getElementById('welcomeHero').style.display = 'none';
        document.getElementById('dashboardError').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';

        const acct = data.account || {};
        const model = data.model || {};
        const assets = data.assets || [];

        // Stats
        const equityEl = document.getElementById('statEquity');
        animateValue(equityEl, 0, acct.equity || 0, 1200, formatCurrency);

        const cashEl = document.getElementById('statCash');
        animateValue(cashEl, 0, acct.cash || 0, 1200, formatCurrency);

        document.getElementById('statBuyingPower').textContent = `購買力: ${formatCurrency(acct.buying_power)}`;

        const env = acct.environment || '';
        document.getElementById('statEnv').innerHTML = env ? `<span class="env-badge">🔬 ${env}</span>` : '';

        // Risk badge
        const nPos = acct.n_positions || (acct.positions ? acct.positions.length : 0);
        document.getElementById('statPositions').textContent = `持倉數: ${nPos}`;
        updateRiskBadge(nPos, acct);

        // Positions table
        renderPositionsTable(acct.positions || []);

        // Chart
        renderAllocationChart(acct.positions || []);

        // Model info
        renderModelInfo(model, assets);
    }

    function updateRiskBadge(nPos, acct) {
        const badge = document.getElementById('riskBadge');
        // Simple risk heuristic based on cash ratio
        const cashRatio = (acct.cash || 0) / (acct.equity || 1);
        let level = 'normal', icon = '🟢', text = 'NORMAL';
        if (cashRatio < 0.1) { level = 'emergency'; icon = '🔴'; text = 'EMERGENCY'; }
        else if (cashRatio < 0.2) { level = 'warning'; icon = '🟠'; text = 'WARNING'; }
        else if (cashRatio < 0.35) { level = 'caution'; icon = '🟡'; text = 'CAUTION'; }
        badge.className = 'risk-badge ' + level;
        badge.textContent = icon + ' ' + text;
    }

    function renderPositionsTable(positions) {
        const tbody = document.getElementById('positionsBody');
        const noPos = document.getElementById('noPositions');

        if (!positions || positions.length === 0) {
            tbody.innerHTML = '';
            noPos.style.display = 'block';
            return;
        }
        noPos.style.display = 'none';

        tbody.innerHTML = positions.map(p => {
            const plClass = (p.unrealized_pl || 0) >= 0 ? 'positive' : 'negative';
            const plSign = (p.unrealized_pl || 0) >= 0 ? '+' : '';
            return `<tr>
                <td class="symbol-cell">${p.symbol}</td>
                <td>${p.qty}</td>
                <td>${formatCurrency(p.avg_cost)}</td>
                <td>${formatCurrency(p.market_value)}</td>
                <td class="${plClass}">${plSign}${formatCurrency(p.unrealized_pl)}</td>
            </tr>`;
        }).join('');
    }

    function renderAllocationChart(positions) {
        const ctx = document.getElementById('allocationChart');
        if (!ctx) return;

        const labels = positions.map(p => p.symbol);
        const values = positions.map(p => Math.abs(p.market_value || 0));
        const colors = ['#00f0ff', '#a78bfa', '#00e676', '#ff3366', '#ffb800', '#38bdf8', '#f472b6'];

        if (allocationChart) {
            allocationChart.data.labels = labels;
            allocationChart.data.datasets[0].data = values;
            allocationChart.data.datasets[0].backgroundColor = colors.slice(0, labels.length);
            allocationChart.update();
            return;
        }

        if (labels.length === 0) {
            labels.push('無持倉');
            values.push(1);
        }

        allocationChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: colors.slice(0, labels.length),
                    borderColor: 'rgba(11,15,25,0.8)',
                    borderWidth: 2,
                    hoverBorderWidth: 0,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true,
                cutout: '68%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#8892a4',
                            font: { family: 'Inter', size: 11, weight: '500' },
                            padding: 16,
                            usePointStyle: true,
                            pointStyleWidth: 10
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(17,24,39,0.95)',
                        titleColor: '#f0f4f8',
                        bodyColor: '#8892a4',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 12,
                        titleFont: { family: 'Inter', weight: '600' },
                        bodyFont: { family: 'Inter' },
                        callbacks: {
                            label: function(ctx) {
                                return ctx.label + ': ' + formatCurrency(ctx.raw);
                            }
                        }
                    }
                }
            }
        });
    }

    function renderModelInfo(model, assets) {
        const grid = document.getElementById('modelInfoGrid');
        grid.innerHTML = `
            <div class="model-info-item">
                <span class="model-info-label">Checkpoint</span>
                <span class="model-info-value">${model.name || '—'}</span>
            </div>
            <div class="model-info-item">
                <span class="model-info-label">模型大小</span>
                <span class="model-info-value">${model.size_mb ? model.size_mb + ' MB' : '—'}</span>
            </div>
            <div class="model-info-item">
                <span class="model-info-label">最後更新</span>
                <span class="model-info-value">${model.modified || '—'}</span>
            </div>
        `;

        const badges = document.getElementById('assetBadges');
        badges.innerHTML = (assets || []).map(a => `<span class="asset-badge">${a}</span>`).join('');
    }

    function startDashboardRefresh() {
        stopDashboardRefresh();
        dashboardInterval = setInterval(() => {
            if (currentPage === 'dashboard') loadDashboard();
        }, 30000);
    }

    function stopDashboardRefresh() {
        if (dashboardInterval) {
            clearInterval(dashboardInterval);
            dashboardInterval = null;
        }
    }

    function updateConnectionStatus(connected) {
        isConnected = connected;
        const dot = document.getElementById('connectionDot');
        const label = document.getElementById('connectionLabel');
        if (connected) {
            dot.className = 'status-dot';
            label.textContent = '已連線';
        } else {
            dot.className = 'status-dot disconnected';
            label.textContent = '未連線';
        }
    }

    // ===== Chat / Advisor =====
    function appendMessage(role, text) {
        const container = document.getElementById('chatMessages');

        if (role === 'user') {
            const wrapper = document.createElement('div');
            wrapper.className = 'chat-bubble-wrapper user-wrapper';
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble user';
            bubble.textContent = text;
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        } else {
            const wrapper = document.createElement('div');
            wrapper.className = 'chat-bubble-wrapper';
            const avatar = document.createElement('div');
            avatar.className = 'ai-avatar';
            avatar.textContent = '🤖';
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble ai';
            bubble.innerHTML = renderMarkdown(text);
            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
        }

        container.scrollTop = container.scrollHeight;
    }

    function showTypingIndicator() {
        const container = document.getElementById('chatMessages');
        const wrapper = document.createElement('div');
        wrapper.className = 'chat-bubble-wrapper';
        wrapper.id = 'typingIndicator';
        const avatar = document.createElement('div');
        avatar.className = 'ai-avatar';
        avatar.textContent = '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble ai typing-indicator';
        bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;
    }

    function removeTypingIndicator() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text && !selectedFile) return;

        input.value = '';

        if (selectedFile) {
            await uploadImage(text || '請分析這張圖片');
            return;
        }

        appendMessage('user', text);
        chatHistory.push({ role: 'user', content: text });

        showTypingIndicator();

        try {
            const resp = await fetch('/api/advisor/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            removeTypingIndicator();

            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const reply = data.response || data.message || '（無回應）';
            appendMessage('ai', reply);
            chatHistory.push({ role: 'ai', content: reply });
        } catch (err) {
            removeTypingIndicator();
            appendMessage('ai', '⚠️ 無法取得回應，請稍後再試。\n\n錯誤：' + err.message);
        }
    }

    async function uploadImage(prompt) {
        if (!selectedFile) return;

        appendMessage('user', `📷 ${selectedFile.name}\n${prompt}`);
        showTypingIndicator();

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('prompt', prompt);

        removeFile();

        try {
            const resp = await fetch('/api/advisor/upload', {
                method: 'POST',
                body: formData
            });
            removeTypingIndicator();

            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const reply = data.response || data.message || '（無回應）';
            appendMessage('ai', reply);
        } catch (err) {
            removeTypingIndicator();
            appendMessage('ai', '⚠️ 圖片上傳失敗。\n\n錯誤：' + err.message);
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        selectedFile = file;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('filePreview').classList.add('visible');
    }

    function removeFile() {
        selectedFile = null;
        document.getElementById('imageUpload').value = '';
        document.getElementById('filePreview').classList.remove('visible');
    }

    function sendQuickAction(message) {
        document.getElementById('chatInput').value = message;
        sendMessage();
    }

    function handleChatKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ===== Monitor =====
    async function runHealthCheck() {
        const btn = document.getElementById('healthCheckBtn');
        const results = document.getElementById('healthResults');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> 檢查中...';
        results.innerHTML = '';

        try {
            const resp = await fetch('/api/health');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            const statusClass = data.is_healthy ? 'healthy' : 'unhealthy';
            const statusIcon = data.is_healthy ? '✅' : '🚨';
            const statusText = data.is_healthy ? '系統正常' : '需要關注';

            let html = `
                <div class="health-results animate-in">
                    <div class="summary-badge ${statusClass}">${statusIcon} ${statusText}${data.summary ? ' — ' + data.summary : ''}</div>
            `;

            if (data.checks && data.checks.length > 0) {
                data.checks.forEach(check => {
                    let icon = '✅';
                    if (check.severity === 'warning') icon = '⚠️';
                    else if (check.severity === 'critical') icon = '🚨';
                    html += `
                        <div class="health-item">
                            <span class="health-icon">${icon}</span>
                            <span class="health-name">${check.name}</span>
                            <span class="health-message">${check.message || ''}</span>
                        </div>
                    `;
                });
            }

            html += '</div>';
            results.innerHTML = html;
        } catch (err) {
            results.innerHTML = `<div class="error-banner animate-in" style="margin-top:16px;">🚨 健康檢查失敗：${err.message}</div>`;
        }

        btn.disabled = false;
        btn.innerHTML = '▶ 執行檢查';
    }

    async function loadMonitorModelInfo() {
        const container = document.getElementById('monitorModelInfo');
        try {
            const resp = await fetch('/api/dashboard');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const model = data.model || {};
            const assets = data.assets || [];

            container.innerHTML = `
                <div class="model-info-grid">
                    <div class="model-info-item">
                        <span class="model-info-label">Checkpoint</span>
                        <span class="model-info-value">${model.name || '—'}</span>
                    </div>
                    <div class="model-info-item">
                        <span class="model-info-label">模型大小</span>
                        <span class="model-info-value">${model.size_mb ? model.size_mb + ' MB' : '—'}</span>
                    </div>
                    <div class="model-info-item">
                        <span class="model-info-label">最後更新</span>
                        <span class="model-info-value">${model.modified || '—'}</span>
                    </div>
                </div>
                <div class="asset-badges" style="margin-top:16px;">
                    ${assets.map(a => `<span class="asset-badge">${a}</span>`).join('')}
                </div>
            `;
        } catch (err) {
            container.innerHTML = `<div class="error-banner">🚨 無法載入模型資訊</div>`;
        }
    }

    async function runPipeline() {
        const btn = document.getElementById('pipelineBtn');
        const results = document.getElementById('pipelineResults');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> 執行中...';
        results.innerHTML = '';

        try {
            const resp = await fetch('/api/run_pipeline', { method: 'POST' });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            let html = '<div class="pipeline-results animate-in">';

            // Allocations table
            if (data.allocations || data.target_allocations) {
                const allocs = data.allocations || data.target_allocations;
                html += '<h4 style="font-size:0.9rem;font-weight:700;margin-bottom:12px;color:var(--cyan);">📊 目標配置</h4>';
                html += '<table class="alloc-table"><thead><tr><th>標的</th><th>配置比例</th></tr></thead><tbody>';
                if (Array.isArray(allocs)) {
                    allocs.forEach(item => {
                        const sym = item.asset || item.symbol || 'Unknown';
                        const weight = item.safe_weight ?? item.weight ?? item.regime_weight ?? 0;
                        const pct = (typeof weight === 'number') ? (weight * 100).toFixed(1) + '%' : weight;
                        const action = item.action ? ` <span style="color:var(--text-muted);font-size:0.8em">(${item.action})</span>` : '';
                        html += `<tr><td class="symbol-cell">${sym}</td><td>${pct}${action}</td></tr>`;
                    });
                } else if (typeof allocs === 'object') {
                    Object.entries(allocs).forEach(([sym, weight]) => {
                        const pct = (typeof weight === 'number') ? (weight * 100).toFixed(1) + '%' : weight;
                        html += `<tr><td class="symbol-cell">${sym}</td><td>${pct}</td></tr>`;
                    });
                }
                html += '</tbody></table>';
            }

            // Reasoning
            if (data.reasoning || data.explanation) {
                const reasoning = data.reasoning || data.explanation;
                html += `<div class="reasoning-panel"><strong>💡 推理過程</strong><br><br>${renderMarkdown(typeof reasoning === 'string' ? reasoning : JSON.stringify(reasoning, null, 2))}</div>`;
            }

            // Raw fallback
            if (!data.allocations && !data.target_allocations && !data.reasoning && !data.explanation) {
                html += `<div class="reasoning-panel"><pre style="white-space:pre-wrap;font-size:0.82rem;color:var(--text-secondary);">${JSON.stringify(data, null, 2)}</pre></div>`;
            }

            html += '</div>';
            results.innerHTML = html;
        } catch (err) {
            results.innerHTML = `<div class="error-banner animate-in" style="margin-top:16px;">🚨 Pipeline 執行失敗：${err.message}</div>`;
        }

        btn.disabled = false;
        btn.innerHTML = '⚡ 執行 Pipeline';
    }

    // ===== Initialization =====
    document.addEventListener('DOMContentLoaded', () => {
        showPage('dashboard');
    });
    </script>
</body>
</html>
